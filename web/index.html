<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Sharky, Agenda U14/U16</title>
    <link rel="icon" href="https://www.cabeglais.fr/app/uploads/2022/04/cropped-logo-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero__media" aria-hidden="true"></div>
        <div class="hero__veil" aria-hidden="true"></div>
        <div class="hero__inner">
          <a class="brand" href="https://www.cabeglais.fr/" target="_blank" rel="noopener">
            <img
              class="brand__mark"
              src="https://www.cabeglais.fr/app/uploads/2022/04/cropped-logo.png"
              width="88"
              height="88"
              alt="Logo CA Béglais"
            />
            <span class="brand__tag">Athlétisme · depuis 1907</span>
          </a>

          <div class="hero__copy">
            <h1>
              Team Sharky
              <span>Agenda <em>U14/U16</em></span>
            </h1>
          </div>
        </div>
      </header>

      <main>
        <section class="block picker-block" aria-labelledby="competition-label">
          <label class="comp-picker" for="competition-select">
            <span id="competition-label">Compétition</span>
            <select id="competition-select" disabled>
              <option value="">Chargement…</option>
            </select>
          </label>
          <p id="status" class="status" role="status"></p>
        </section>

        <section id="planning" class="block planning" hidden aria-labelledby="planning-title">
          <header class="planning__head">
            <div class="planning__intro">
              <p class="eyebrow">Planning club</p>
              <h2 id="planning-title">Épreuves</h2>
              <p id="planning-place" class="place"></p>
            </div>
            <p id="planning-meta" class="planning__meta"></p>
          </header>
          <div id="schedule" class="schedule"></div>
        </section>
      </main>

      <footer class="foot">
        <a href="https://www.cabeglais.fr/" target="_blank" rel="noopener">cabeglais.fr</a>
        <span>Section Athlétisme</span>
      </footer>
    </div>

    <dialog id="athlete-dialog" class="athlete-dialog" aria-labelledby="athlete-dialog-title">
      <form method="dialog" class="athlete-dialog__panel">
        <header class="athlete-dialog__head">
          <div>
            <p class="eyebrow">Athlète</p>
            <h2 id="athlete-dialog-title"></h2>
            <p id="athlete-dialog-meta" class="place"></p>
          </div>
          <button type="submit" class="athlete-dialog__close" value="close" aria-label="Fermer">
            ×
          </button>
        </header>
        <div id="athlete-dialog-body" class="athlete-dialog__body"></div>
      </form>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
