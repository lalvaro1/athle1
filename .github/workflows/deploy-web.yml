# Déploie le site statique (web/) vers Cloudflare R2 : s3://athle/web/
#
# Secrets GitHub requis dans l’environnement PROD
# (Settings → Environments → PROD → Environment secrets) :
#   R2_ACCOUNT_ID        — ID compte Cloudflare
#   R2_ACCESS_KEY_ID     — Access Key ID (token R2 S3)
#   R2_SECRET_ACCESS_KEY — Secret Access Key (token R2 S3)
#
# Créer les clés : Cloudflare → R2 → Overview → Manage R2 API Tokens
#   → Create Account API token → Object Read & Write sur le bucket "athle"
#   (ce ne sont PAS les mêmes que le token Bearer du Google Apps Script)

name: Deploy web to R2

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-r2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check R2 secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant : $name"
              missing=1
            else
              echo "OK $name (défini)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Ajoute les 3 secrets dans Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Upload site files to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: athle
        run: |
          set -euo pipefail
          for file in index.html team-athle-virtuelle.html team-athle-virtuelle.js app.js styles.css; do
            case "$file" in
              *.html) ctype="text/html; charset=utf-8" ;;
              *.css)  ctype="text/css; charset=utf-8" ;;
              *.js)   ctype="text/javascript; charset=utf-8" ;;
              *)      ctype="application/octet-stream" ;;
            esac
            echo "→ web/$file ($ctype)"
            aws s3 cp "web/$file" "s3://${BUCKET}/web/$file" \
              --endpoint-url "$AWS_ENDPOINT_URL" \
              --content-type "$ctype" \
              --cache-control "public, max-age=60"
          done
          echo "Deploy OK — https://pub-e5058c16a56f4bf5ba83dcdbd80dc5b3.r2.dev/web/"
