# Déploie le site statique (web/) vers Cloudflare R2 : s3://athle/web/
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   R2_ACCOUNT_ID       — ID compte Cloudflare (ex. dfd48543…)
#   R2_ACCESS_KEY_ID    — Access Key ID du token R2 (API S3)
#   R2_SECRET_ACCESS_KEY — Secret Access Key du token R2
#
# Créer les clés : Cloudflare Dashboard → R2 → Manage R2 API Tokens
#   → Create API token (Object Read & Write sur le bucket athle)

name: Deploy web to R2

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-r2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure R2 (S3-compatible) credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload site files to R2
        env:
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: athle
        run: |
          set -euo pipefail
          for file in index.html app.js styles.css; do
            case "$file" in
              *.html) ctype="text/html; charset=utf-8" ;;
              *.css)  ctype="text/css; charset=utf-8" ;;
              *.js)   ctype="text/javascript; charset=utf-8" ;;
              *)      ctype="application/octet-stream" ;;
            esac
            echo "→ web/$file ($ctype)"
            aws s3 cp "web/$file" "s3://${BUCKET}/web/$file" \
              --endpoint-url "$AWS_ENDPOINT_URL" \
              --content-type "$ctype" \
              --cache-control "public, max-age=60"
          done
          echo "Deploy OK — https://pub-e5058c16a56f4bf5ba83dcdbd80dc5b3.r2.dev/web/"
